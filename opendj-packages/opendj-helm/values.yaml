replicaCount: 1

image:
  repository: openidentityplatform/opendj
  tag: ""
  pullPolicy: IfNotPresent

directory:
  baseDn: dc=example,dc=com
  createBaseEntry: true

auth:
  rootDn: cn=Directory Manager
  # Empty names use <fullname>-root. Create the Secret before installing.
  existingSecret: ""
  passwordKey: password

persistence:
  size: 10Gi
  # Empty uses the default StorageClass.
  storageClass: ""

replication:
  enabled: false
  # Override during a two-step resize. Null tracks replicaCount.
  peerCount: null

service:
  admin:
    enabled: false

securityContext:
  profile: kubernetes

pdb:
  enabled: false

topologySpreadConstraints: []

probes:
  startup:
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 60
  readiness:
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 1
  liveness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

terminationGracePeriodSeconds: 60

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

tls:
  refreshSeconds: 60
  ldap:
    enabled: false
    keystoreSecret:
      name: ""
      key: keystore.p12
    passwordSecret:
      name: ""
      key: password
  admin:
    enabled: false
    keystoreSecret:
      name: ""
      key: keystore.jks
    passwordSecret:
      name: ""
      key: password
