{{- $name := include "opendj.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "opendj.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "opendj.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: 4444
      targetPort: admin
    - name: replication
      port: 8989
      targetPort: replication
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "opendj.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "opendj.selectorLabels" . | nindent 4 }}
  ports:
    - name: ldap
      port: 1389
      targetPort: ldap
    - name: ldaps
      port: 1636
      targetPort: ldaps
{{- if .Values.service.admin.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-admin
  labels:
    {{- include "opendj.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "opendj.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: 4444
      targetPort: admin
{{- end }}
