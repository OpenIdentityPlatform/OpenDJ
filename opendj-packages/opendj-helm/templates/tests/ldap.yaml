apiVersion: v1
kind: Pod
metadata:
  name: {{ include "opendj.fullname" . }}-ldap-test
  labels:
    app.kubernetes.io/name: opendj-test
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    {{- include "opendj.podSecurityContext" . | nindent 4 }}
  containers:
    - name: ldapsearch
      image: {{ include "opendj.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- include "opendj.containerSecurityContext" . | nindent 8 }}
      command: ["/opt/opendj/bin/ldapsearch"]
      args:
        - --noPropertiesFile
        - --hostname
        - {{ include "opendj.fullname" . | quote }}
        - --port
        - "1389"
        - --baseDN
        - ""
        - --searchScope
        - base
        - "(objectClass=*)"
        - "1.1"
