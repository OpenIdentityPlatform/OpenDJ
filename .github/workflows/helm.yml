name: Helm manifests

on:
  pull_request:
    paths:
      - 'opendj-packages/opendj-helm/**'
      - '.github/helm/**'
      - '.github/scripts/helm-test-opendj.sh'
      - '.github/workflows/helm-kind.yml'
      - '.github/workflows/helm.yml'
  push:
    branches: [master]
    paths:
      - 'opendj-packages/opendj-helm/**'
      - '.github/helm/**'
      - '.github/scripts/helm-test-opendj.sh'
      - '.github/workflows/helm-kind.yml'
      - '.github/workflows/helm.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.22.1, v4.3.2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ matrix.helm }}
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        if: matrix.helm == 'v3.22.1'
        with:
          version: '3.15.0'
      - name: Lint the chart and run template tests
        if: matrix.helm == 'v3.22.1'
        run: |
          ct lint --config .github/helm/ct.yaml --charts opendj-packages/opendj-helm \
            --helm-lint-extra-args '--kube-version 1.34.11'
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1
          helm unittest opendj-packages/opendj-helm
      - name: Install kubeconform
        run: |
          work=$(mktemp -d)
          cd "$work"
          release=https://github.com/yannh/kubeconform/releases/download/v0.8.0
          curl -fsSLO "$release/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "$release/CHECKSUMS"
          grep '  kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c
          tar -xf kubeconform-linux-amd64.tar.gz kubeconform
          echo "$work" >> "$GITHUB_PATH"
      - name: Validate rendered Kubernetes resources
        shell: bash
        run: |
          chart=opendj-packages/opendj-helm
          helm lint --strict --kube-version 1.34.11 "$chart"
          for version in 1.34.11 1.36.4; do
            helm template directory "$chart" --kube-version "$version" |
              kubeconform -strict -summary -kubernetes-version "$version"
            helm template directory "$chart" --kube-version "$version" \
              --set replicaCount=2,replication.enabled=true,pdb.enabled=true,service.admin.enabled=true \
              --set securityContext.profile=openshift \
              --set tls.ldap.enabled=true,tls.ldap.keystoreSecret.name=ldap,tls.ldap.passwordSecret.name=ldap \
              --set tls.admin.enabled=true,tls.admin.keystoreSecret.name=admin,tls.admin.passwordSecret.name=admin |
              kubeconform -strict -summary -kubernetes-version "$version"
          done

          invalid_tls=$(mktemp)
          if helm template directory "$chart" --kube-version 1.34.11 \
            --set tls.ldap.enabled=true,tls.ldap.keystoreSecret.name=ldap,tls.ldap.passwordSecret.name=ldap \
            --set-json tls.ldap.passwordSecret.key=null > "$invalid_tls" 2>&1; then
            echo 'Helm accepted a null TLS PIN Secret key' >&2
            exit 1
          fi
          grep -F "missing property 'key'" "$invalid_tls"
