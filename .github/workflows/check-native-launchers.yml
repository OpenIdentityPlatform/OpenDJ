# The committed opendj-server-legacy/lib/*.exe launchers are what Linux-built server
# zips - and therefore tagged releases - ship, while the Windows CI jobs overwrite them
# with freshly compiled ones before testing. Build's own comparison step is warning-only
# so an MSVC toolchain bump on the runner image cannot take down the artifact consumers
# (test-msi*, deploy.yml). This standalone workflow is the failing signal instead: it
# triggers only when the native sources or the committed binaries change - exactly the
# case where stale binaries must block a merge - and its conclusion gates nothing else.
name: Native launchers

on:
  push:
    branches: [ 'master' ]
    paths:
      - 'opendj-server-legacy/src/build-tools/windows/**'
      - 'opendj-server-legacy/lib/*.exe'
  pull_request:
    paths:
      - 'opendj-server-legacy/src/build-tools/windows/**'
      - 'opendj-server-legacy/lib/*.exe'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: 'windows-latest'
    steps:
      - uses: actions/checkout@v6
      - name: Setup MSVC Developer Command Prompt (x86)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        env:
          # Opt in to Node.js 24 for this action, which still ships on Node.js 20.
          # See https://github.com/ilammy/msvc-dev-cmd/issues/99
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          arch: x86
      - name: Build the native launchers from source
        shell: cmd
        run: |
          cd opendj-server-legacy\src\build-tools\windows
          nmake all || exit /b 1
          xcopy /Y *.exe ..\..\..\lib\ || exit /b 1
      - name: Committed launcher binaries must match the sources
        shell: bash
        run: |
          # git diff alone misses a brand-new launcher that was never git-added:
          # status --porcelain reports modified and untracked files alike.
          if [ -n "$(git status --porcelain -- opendj-server-legacy/lib)" ]; then
            git status --porcelain -- opendj-server-legacy/lib
            echo "::error title=Stale launcher binaries::opendj-server-legacy/lib/*.exe do not match the sources. Refresh them from the windows-exe artifact of a Build run on this branch and commit them."
            exit 1
          fi
