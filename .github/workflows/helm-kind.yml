name: Helm integration

on:
  workflow_call:
    inputs:
      image-version:
        description: Tag of the Docker image built by this run
        required: true
        type: string

permissions:
  contents: read

jobs:
  kind:
    name: Helm on Kubernetes ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v1.34.11
            node: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - version: v1.36.4
            node: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: '3.15.0'
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          node_image: ${{ matrix.node }}
          kubectl_version: ${{ matrix.version }}
          cluster_name: opendj-helm
          wait: 180s
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image-default
          path: ${{ runner.temp }}/opendj-image
      - name: Load the image built by this workflow
        env:
          IMAGE_VERSION: ${{ inputs.image-version }}
        run: |
          docker load -i "$RUNNER_TEMP/opendj-image/image.tar"
          docker tag "localhost:5000/${GITHUB_REPOSITORY,,}:$IMAGE_VERSION" "opendj-helm-ci:$GITHUB_SHA"
          kind load docker-image --name opendj-helm "opendj-helm-ci:$GITHUB_SHA"
      - name: Install and run the Helm hook with ct
        run: |
          kubectl create namespace opendj-helm-ct
          kubectl label namespace opendj-helm-ct pod-security.kubernetes.io/enforce=restricted
          password=$(mktemp)
          trap 'rm -f "$password"' EXIT
          printf '%s' "$(openssl rand -hex 20)" > "$password"
          kubectl -n opendj-helm-ct create secret generic directory-root --from-file=password="$password"
          ct install --config .github/helm/ct.yaml --charts opendj-packages/opendj-helm \
            --namespace opendj-helm-ct --release-name directory --helm-extra-args '--timeout 15m' \
            --helm-extra-set-args "--set-string image.repository=opendj-helm-ci,image.tag=$GITHUB_SHA,image.pullPolicy=Never,auth.existingSecret=directory-root"
      - name: Check persistence, replication, resize and certificate renewal
        run: .github/scripts/helm-test-opendj.sh "$GITHUB_SHA"
